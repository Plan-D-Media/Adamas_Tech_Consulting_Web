# Local PostgreSQL alternative to Neon. Usage: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adamas
      POSTGRES_PASSWORD: adamas_dev
      POSTGRES_DB: adamas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adamas"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
